[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=wggbot --cov-report=term-missing"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "SIM", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["discord.*", "yt_dlp.*"]
ignore_missing_imports = true
